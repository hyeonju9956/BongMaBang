<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F3EE">
  <title>승인 관리 - 봉현마을방범대</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/editor.css">
  <link rel="stylesheet" href="../css/admin-approval.css">
</head>
<body>
  <main class="editor">
    <header class="topbar">
      <div>
        <p class="eyebrow">ADMINISTRATION</p>
        <h1>관리자 승인 관리</h1>
        <p class="intro">일반 사용자가 제출한 변경 요청을 검토하고 계정을 관리합니다.</p>
      </div>
      <nav class="editor-nav" aria-label="관리 메뉴">
        <a class="back-link" href="./">에피소드 편집기</a>
        <button id="admin-logout" class="button secondary" type="button" hidden>로그아웃</button>
      </nav>
    </header>

    <p id="admin-notice" class="notice" role="alert" hidden></p>

    <section id="admin-login" class="login-panel" aria-label="관리자 로그인">
      <h2>관리자 로그인</h2>
      <p>승인 관리 화면은 관리자 계정만 사용할 수 있습니다.</p>
      <form id="admin-login-form">
        <label class="field">
          <span>아이디</span>
          <input id="admin-username" autocomplete="username" required>
        </label>
        <label class="field">
          <span>비밀번호</span>
          <input id="admin-password" type="password" autocomplete="current-password" required>
        </label>
        <button class="button primary" type="submit">관리자 로그인</button>
      </form>
    </section>

    <div id="admin-content" hidden>
      <section class="admin-panel" aria-labelledby="requests-title">
        <h2 id="requests-title">승인 대기 요청 <span id="pending-count" class="request-badge">0</span></h2>
        <p id="refresh-status" class="intro">요청 목록을 불러오는 중입니다.</p>
        <div id="request-list"></div>
        <section id="request-detail" class="request-detail" aria-live="polite" hidden></section>
      </section>

      <section class="admin-panel" aria-labelledby="accounts-title">
        <h2 id="accounts-title">일반 사용자 계정</h2>
        <form id="account-form" class="account-form">
          <label class="field">
            <span>아이디</span>
            <input id="new-username" autocomplete="off" minlength="3" maxlength="32" required>
          </label>
          <label class="field">
            <span>임시 비밀번호 <small>12자 이상</small></span>
            <input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
          </label>
          <button class="button primary" type="submit">계정 생성</button>
        </form>
        <div id="account-list"></div>
      </section>
    </div>
  </main>
  <script src="../js/api-config.js"></script>
  <script type="module" src="../js/editor-admin.js"></script>
</body>
</html>
