<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F3EE">
  <title>봉현마을방범대</title>
  <script>document.documentElement.classList.add("auth-pending");</script>
  <style>html.auth-pending body { visibility: hidden; }</style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/api-config.js"></script>
  <script type="module" src="js/site-auth.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div>
        <p class="eyebrow" id="since">SINCE</p>
        <h1 id="title">봉현마을방범대</h1>
        <p class="lede" id="lede"></p>
        <nav class="site-actions" aria-label="계정 메뉴">
          <a class="editor-link" href="editor/">editor</a>
          <button class="editor-link" id="logout" type="button">로그아웃</button>
        </nav>
      </div>
      <div>
        <svg id="sky" viewBox="0 0 640 470" role="img" aria-label="이야기 하나가 별 하나인 BB 별자리">
          <g id="ghost"></g>
          <g id="clines"></g>
          <g id="stars"></g>
        </svg>
        <p class="caption" id="caption" aria-live="polite"></p>
      </div>
    </header>

    <div class="err" id="err" role="alert" hidden></div>

    <div class="layout">
      <aside class="side">
        <div class="find">
          <input id="q" type="search" placeholder="친구 이름, 장소, 키워드" autocomplete="off" aria-label="이야기 찾기">
          <button class="x" id="clear" type="button" aria-label="검색어 지우기" hidden>×</button>
        </div>
        <p class="toc-label">시기</p>
        <ul class="toc" id="toc"></ul>
      </aside>
      <main>
        <p class="result" id="result" aria-live="polite" hidden></p>
        <div id="book"></div>
      </main>
    </div>
    <p class="foot" id="foot"></p>
  </div>
</body>
</html>
