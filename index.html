<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>봉현마을방범대의 밤하늘</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0E1230; --night2:#1B2152; --ink:#F4EEDB; --soft:#9EA5D2; --line:rgba(244,238,219,.5);
  --gold:#FFE08A; --moon:#F5E9C4; --moon2:#DCCB98;
  --e0:#FF9A8A; --e1:#FFC07A; --e2:#FFE58A; --e3:#A6E59A; --e4:#8FCBFF; --e5:#C7AEFF; --e6:#FFA6CF;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--night)}
body{
  background:radial-gradient(120% 80% at 70% 0%, var(--night2), var(--night) 60%) fixed, var(--night);
  color:var(--ink); min-height:100vh;
  font-family:"Gaegu","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size:19px; line-height:1.55; word-break:keep-all;
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px dashed var(--gold);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:30px 20px 70px}
.jua{font-family:"Jua","Gaegu",sans-serif;font-weight:400}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 30px}
h1{font-family:"Jua",sans-serif;font-weight:400;font-size:clamp(32px,5.4vw,52px);line-height:1.1}
.since{display:block;font-size:16px;letter-spacing:3px;color:var(--gold);margin-bottom:6px;font-family:"Jua",sans-serif}
.progress{font-size:19px;color:var(--soft);max-width:30em}
.progress b{color:var(--gold);font-weight:700}

/* ---- 하늘 ---- */
.sky{margin:18px -20px 0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sky::-webkit-scrollbar{display:none}
#sky{display:block;width:100%;min-width:820px;height:auto}
.bgstar{fill:#fff}
.bbdot{fill:var(--ink);opacity:.45}
.bbghost{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:2 7;stroke-linecap:round;opacity:.22}
.bbline{stroke:var(--line);stroke-width:1.2;fill:none;stroke-linecap:round}
.star{cursor:pointer}
.star .core{transform-box:fill-box;transform-origin:center}
.star.dim{opacity:.16}
.star.on .ring{opacity:1}
.ring{fill:none;stroke:var(--gold);stroke-width:1.4;stroke-dasharray:3 3;opacity:0}
.star:focus{outline:none}
.star:focus-visible .ring{opacity:1}
.newest .core{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
.born{opacity:0;animation:born .6s ease-out forwards;animation-delay:var(--d)}
@keyframes born{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
.born{transform-box:fill-box;transform-origin:center}
.findline{fill:none;stroke:var(--gold);stroke-width:1.6;stroke-dasharray:2 6;stroke-linecap:round}
.label{font-family:"Gaegu",sans-serif;fill:var(--soft);font-size:17px}
.name{font-family:"Gaegu",sans-serif;fill:var(--ink);font-size:16px;cursor:pointer}
.name:hover{fill:var(--gold)}
.dragon{stroke:var(--soft);stroke-width:1;fill:none;stroke-dasharray:1 5;stroke-linecap:round;opacity:.8}

/* ---- 별 이야기 ---- */
.story{margin:6px auto 0;max-width:720px;min-height:150px;text-align:center;padding:10px 6px 0}
.story .era{display:inline-block;font-size:16px;padding:1px 12px;border-radius:999px;border:1.5px solid var(--c);color:var(--c)}
.story h2{font-family:"Jua",sans-serif;font-weight:400;font-size:30px;line-height:1.25;margin:8px 0 6px}
.story p{font-size:20px;line-height:1.6;max-width:34em;margin:0 auto}
.story .meta{font-size:16px;color:var(--soft);margin-top:10px;display:flex;justify-content:center;align-items:center;gap:18px}
.story .meta button{padding:2px 8px;color:var(--soft)}
.story .meta button:hover{color:var(--ink)}
.story .legend{font-size:17px;color:var(--soft)}
.who{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 12px;margin-top:8px;font-size:17px}
.who button{color:var(--soft);border-bottom:1.5px dashed currentColor;line-height:1.25}
.who button:hover{color:var(--gold)}
mark{background:none;color:var(--gold);border-bottom:2px solid var(--gold)}

/* ---- 찾기 & 시기 ---- */
.controls{margin-top:40px;display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;border-top:1.5px dashed rgba(158,165,210,.35);padding-top:26px}
.eras{display:flex;flex-wrap:wrap;gap:8px}
.eras button{padding:3px 14px;border-radius:999px;border:1.5px solid rgba(158,165,210,.5);font-size:18px;color:var(--soft);display:flex;align-items:center;gap:6px}
.eras button i{width:9px;height:9px;border-radius:50%;background:var(--c);display:block}
.eras button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:rgba(244,238,219,.08)}
.find{position:relative;flex:1 1 260px;max-width:360px}
.find input{width:100%;padding:7px 38px 7px 16px;font-size:19px;background:rgba(14,18,48,.6);border:1.5px solid rgba(158,165,210,.6);border-radius:999px;outline:none}
.find input:focus{border-color:var(--gold)}
.find input::placeholder{color:var(--soft)}
.find input::-webkit-search-cancel-button{display:none}
.find .x{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--soft);padding:2px 6px}
.find .x[hidden]{display:none}

.list{margin-top:26px;columns:2 340px;column-gap:28px}
.group{break-inside:avoid;margin-bottom:22px}
.group h3{font-family:"Jua",sans-serif;font-weight:400;font-size:22px;color:var(--c);margin-bottom:6px;display:flex;align-items:baseline;gap:8px}
.group h3 small{font-family:"Gaegu",sans-serif;font-size:16px;color:var(--soft)}
.item{display:block;width:100%;text-align:left;padding:8px 0 8px 18px;position:relative;border-radius:6px}
.item::before{content:"✦";position:absolute;left:0;top:9px;color:var(--c);font-size:13px}
.item b{font-weight:700;font-size:19px}
.item span{display:block;font-size:17px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item:hover b,.item.on b{color:var(--gold)}
.empty{color:var(--soft);font-size:19px}

@media (prefers-reduced-motion:reduce){
  .newest .core,.born{animation:none;opacity:1}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <span class="since" id="since"></span>
      <h1 id="title"></h1>
    </div>
    <p class="progress" id="progress"></p>
  </header>

  <div class="sky" id="skyWrap">
    <svg id="sky" viewBox="0 0 1200 700" role="img" aria-label="썰이 별이 되어 떠 있는 밤하늘">
      <defs>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
        <radialGradient id="moonShade" cx="38%" cy="35%" r="70%">
          <stop offset="0" stop-color="#FFF7DA"/><stop offset="1" stop-color="#E7D7A6"/>
        </radialGradient>
        <filter id="moonGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
      </defs>
      <g id="bg"></g>
      <g id="dragon"></g>
      <g id="moon"></g>
      <g id="bbDots"></g>
      <g id="bbLines"></g>
      <path id="findline" class="findline" d=""/>
      <g id="stars"></g>
    </svg>
  </div>

  <section class="story" id="story" aria-live="polite"></section>

  <section class="controls">
    <div class="eras" id="eras" role="group" aria-label="시기별로 보기"></div>
    <div class="find">
      <input id="q" type="search" placeholder="친구 이름이나 키워드로 별 찾기" autocomplete="off" aria-label="별 찾기">
      <button class="x" id="clear" type="button" aria-label="검색어 지우기" hidden>×</button>
    </div>
  </section>

  <section class="list" id="list"></section>
</div>

<script src="episodes.js"></script>
<script>
(function(){
  const BB = [[[0.334,0.045],[0.226,0.069],[0.13,0.12],[0.063,0.206],[0.08,0.31],[0.128,0.397],[0.038,0.461],[0.001,0.561],[0.042,0.66],[0.125,0.736],[0.226,0.774],[0.338,0.77],[0.445,0.743],[0.471,0.653],[0.499,0.547],[0.523,0.442],[0.548,0.335],[0.569,0.226],[0.532,0.127],[0.446,0.057]],[[0.793,0.0],[0.707,0.013],[0.63,0.042],[0.628,0.127],[0.611,0.208],[0.593,0.292],[0.577,0.376],[0.569,0.462],[0.62,0.531],[0.694,0.567],[0.783,0.564],[0.862,0.538],[0.931,0.487],[0.964,0.411],[0.93,0.337],[0.927,0.278],[0.987,0.217],[0.994,0.136],[0.946,0.064],[0.876,0.017]],[[0.378,0.185],[0.404,0.277],[0.338,0.354],[0.224,0.321],[0.262,0.219]],[[0.319,0.464],[0.337,0.558],[0.277,0.656],[0.16,0.614],[0.2,0.503]],[[0.777,0.095],[0.872,0.121],[0.853,0.207],[0.762,0.243],[0.738,0.179]],[[0.752,0.328],[0.837,0.359],[0.8,0.436],[0.711,0.461],[0.697,0.385]]];
  const SQ = Object.assign({name:"우리 방범대", since:2015, eras:[], rabbits:[], dragons:[]}, window.SQUAD||{});
  const NS="http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PAL = ["--e0","--e1","--e2","--e3","--e4","--e5","--e6"].map(v=>`var(${v})`);
  function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  /* ---------- 데이터 ---------- */
  const ERAS=[...(SQ.eras||[])];
  const EP=(window.EPISODES||[]).map((e,i)=>{
    const who=(Array.isArray(e.who)?e.who:String(e.who||"").split(/[,，、]/)).map(s=>s.trim()).filter(Boolean);
    const era=String(e.era||"언젠가").trim();
    if(!ERAS.includes(era)) ERAS.push(era);
    return {...e, i, who, era, _hay:[e.title,e.text,who.join(" "),era].join(" ").toLowerCase()};
  });
  const eraColor = era => PAL[ERAS.indexOf(era)%PAL.length];

  /* ---------- 제목 ---------- */
  $("since").textContent = "SINCE "+SQ.since;
  $("title").textContent = SQ.name+"의 밤하늘";
  document.title = SQ.name+"의 밤하늘";
  const BBN = BB.reduce((a,g)=>a+g.length,0);
  const left = Math.max(0,BBN-EP.length);
  $("progress").innerHTML = left
    ? `썰 하나가 별 하나. 지금까지 별 <b>${EP.length}개</b>를 띄웠고, BB 별자리 완성까지 <b>${left}개</b> 남았어요.`
    : `BB 별자리를 다 채웠어요! 지금은 별 <b>${EP.length}개</b>로 하늘을 넓혀 가는 중.`;

  /* ---------- 배경 별 ---------- */
  const W=1200,H=700, r0=rng(99);
  let bg="";
  for(let k=0;k<170;k++){
    const x=r0()*W, y=r0()*H, r=r0()<.9?r0()*0.9+.3:r0()*1.4+.8;
    bg+=`<circle class="bgstar" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" opacity="${(.15+r0()*.5).toFixed(2)}"/>`;
  }
  $("bg").innerHTML=bg;

  /* ---------- 달과 달토끼 ---------- */
  const MX=1035, MY=128, MR=70;
  $("moon").innerHTML=`
    <circle cx="${MX}" cy="${MY}" r="${MR+10}" fill="#FFF1C2" opacity=".35" filter="url(#moonGlow)"/>
    <circle cx="${MX}" cy="${MY}" r="${MR}" fill="url(#moonShade)"/>
    <circle cx="${MX-34}" cy="${MY-30}" r="9" fill="#E3D19C" opacity=".6"/>
    <circle cx="${MX+30}" cy="${MY+38}" r="6" fill="#E3D19C" opacity=".6"/>
    <g fill="#CDB97F" opacity=".95">
      <ellipse cx="${MX-6}" cy="${MY+20}" rx="22" ry="17"/>
      <circle cx="${MX+16}" cy="${MY+2}" r="11"/>
      <ellipse cx="${MX+11}" cy="${MY-18}" rx="4.2" ry="14" transform="rotate(-14 ${MX+11} ${MY-18})"/>
      <ellipse cx="${MX+21}" cy="${MY-16}" rx="4.2" ry="13" transform="rotate(16 ${MX+21} ${MY-16})"/>
      <circle cx="${MX-28}" cy="${MY+24}" r="6"/>
      <rect x="${MX+28}" y="${MY+22}" width="16" height="14" rx="3"/>
      <rect x="${MX+34}" y="${MY+4}" width="3" height="22" rx="1.5" transform="rotate(20 ${MX+35} ${MY+20})"/>
    </g>
    <circle cx="${MX+20}" cy="${MY}" r="1.6" fill="#8E7C4E"/>`;
  const mg=$("moon");
  const ml=document.createElementNS(NS,"text"); ml.setAttribute("class","label"); ml.setAttribute("x",MX); ml.setAttribute("y",MY+MR+30); ml.setAttribute("text-anchor","middle");
  ml.textContent="토끼띠 대원들이 사는 달"; mg.appendChild(ml);
  // 토끼띠 이름
  const rab=SQ.rabbits||[]; const rw=rab.map(n=>n.length*15+16); const rtot=rw.reduce((a,b)=>a+b,0);
  let rx=MX-rtot/2;
  rab.forEach((n,k)=>{ const t=document.createElementNS(NS,"text"); t.setAttribute("class","name"); t.setAttribute("x",rx+rw[k]/2); t.setAttribute("y",MY+MR+54);
    t.setAttribute("text-anchor","middle"); t.textContent=n; t.addEventListener("click",()=>setQuery(n)); mg.appendChild(t); rx+=rw[k]; });

  /* ---------- 용자리 ---------- */
  const DP=[[70,650],[120,612],[104,560],[150,520],[214,532],[246,486],[214,440],[232,398],[262,384]];
  let dpath="M"+DP.map(p=>p.join(" ")).join(" L");
  let dsvg=`<path class="dragon" d="${dpath}"/>`;
  DP.forEach(p=>dsvg+=`<circle cx="${p[0]}" cy="${p[1]}" r="1.8" fill="var(--soft)"/>`);
  dsvg+=`<text class="label" x="150" y="672">용자리</text>`;
  $("dragon").innerHTML=dsvg;
  const dIdx=[8,4,0]; // 머리, 몸통, 꼬리
  (SQ.dragons||[]).slice(0,3).forEach((n,k)=>{
    const [x,y]=DP[dIdx[k]];
    const g=document.createElementNS(NS,"g");
    g.innerHTML=`<circle cx="${x}" cy="${y}" r="7" fill="var(--e4)" opacity=".45" filter="url(#glow)"/><circle cx="${x}" cy="${y}" r="3.2" fill="#DDEBFF"/>`+
      `<text class="name" x="${x+(k===1?14:12)}" y="${y+(k===2?-10:20)}">${esc(n)}</text>`;
    g.style.cursor="pointer"; g.addEventListener("click",()=>setQuery(n));
    $("dragon").appendChild(g);
  });

  /* ---------- BB 별자리 위치 ---------- */
  const BX=405, BY=125, BW=470;
  const bbPts=[]; BB.forEach((grp,gi)=>grp.forEach((p,k)=>bbPts.push({x:BX+p[0]*BW, y:BY+p[1]*BW, g:gi, k})));
  $("bbDots").innerHTML=bbPts.map(p=>`<circle class="bbdot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.2"/>`).join("");
  { let gp="", o=0; BB.forEach(grp=>{ gp+="M"+grp.map((_,k)=>bbPts[o+k].x.toFixed(1)+" "+bbPts[o+k].y.toFixed(1)).join(" L")+" Z "; o+=grp.length; });
    $("bbDots").insertAdjacentHTML("afterbegin",`<path class="bbghost" d="${gp}"/>`); }
  // 별 자리 정하기
  const rf=rng(2015), placed=[];
  const blocked=(x,y)=>(x>BX-40&&x<BX+BW+40&&y>BY-40&&y<BY+BW*.78+60)||
    (Math.hypot(x-MX,y-MY)<MR+90)||(x<300&&y>360)||placed.some(p=>Math.hypot(p.x-x,p.y-y)<36);
  EP.forEach(e=>{
    if(e.i<bbPts.length){ e.x=bbPts[e.i].x; e.y=bbPts[e.i].y; e.bb=true; return; }
    let x,y,t=0; do{ x=40+rf()*(W-80); y=36+rf()*(H-72); t++; }while(blocked(x,y)&&t<400);
    e.x=x; e.y=y; placed.push(e);
  });
  // BB 선: 켜진 별끼리 잇기
  let lines="", off=0;
  BB.forEach(grp=>{
    const n=grp.length;
    for(let k=0;k<n;k++){
      const a=off+k, b=off+(k+1)%n;
      if(a<EP.length && b<EP.length) lines+=`M${bbPts[a].x.toFixed(1)} ${bbPts[a].y.toFixed(1)} L${bbPts[b].x.toFixed(1)} ${bbPts[b].y.toFixed(1)} `;
    }
    off+=n;
  });
  $("bbLines").innerHTML=`<path class="bbline" d="${lines}"/>`;

  /* ---------- 별 그리기 ---------- */
  const SPARK="M0 -9 C1.2 -2.4 2.4 -1.2 9 0 C2.4 1.2 1.2 2.4 0 9 C-1.2 2.4 -2.4 1.2 -9 0 C-2.4 -1.2 -1.2 -2.4 0 -9Z";
  const starEls=[];
  EP.forEach((e,idx)=>{
    const c=eraColor(e.era), s=e.bright?1.45:1;
    const g=document.createElementNS(NS,"g");
    g.setAttribute("class","star"+(idx===EP.length-1?" newest":""));
    g.setAttribute("transform",`translate(${e.x.toFixed(1)} ${e.y.toFixed(1)})`);
    g.setAttribute("role","button"); g.setAttribute("tabindex","0");
    g.setAttribute("aria-label",`${idx+1}번째 별, ${e.era}, ${e.title}`);
    g.innerHTML=`<g class="${reduce?"":"born"}" style="--d:${(idx*55)}ms">
        <circle r="${11*s}" fill="${c}" opacity=".45" filter="url(#glow)"/>
        <path class="core" d="${SPARK}" transform="scale(${(.82*s).toFixed(2)})" fill="${c}"/>
        <circle r="${1.8*s}" fill="#fff"/>
        <circle class="ring" r="${14*s}"/>
        <circle r="16" fill="transparent"/>
      </g>`;
    g.addEventListener("click",()=>select(idx));
    g.addEventListener("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select(idx);} });
    $("stars").appendChild(g); starEls.push(g);
  });

  /* ---------- 상태 ---------- */
  let sel=null, era=null, query="";
  const visible = e => (!era||e.era===era) && (!query||e._hay.includes(query));

  function hl(s){
    const safe=esc(s); if(!query) return safe;
    const q=esc(query).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return safe.replace(new RegExp(q,"gi"),m=>`<mark>${m}</mark>`);
  }

  function renderStory(){
    const box=$("story");
    if(sel===null){
      const shown=EP.filter(visible).length;
      box.innerHTML = EP.length
        ? `<p class="legend">${query||era?`조건에 맞는 별 <b style="color:var(--gold)">${shown}개</b>가 빛나고 있어요. 별을 눌러 보세요.`:"별을 눌러 보세요. 별 하나에 썰 하나가 들어 있어요."}</p>`
        : `<p class="legend">아직 뜬 별이 없어요. episodes.js에 첫 썰을 적으면 BB 별자리의 첫 별이 떠요.</p>`;
      return;
    }
    const e=EP[sel], c=eraColor(e.era);
    box.innerHTML=`<span class="era" style="--c:${c}">${esc(e.era)}${e.bright?" ✦ 전설의 썰":""}</span>
      <h2>${hl(e.title)}</h2><p>${hl(e.text)}</p>
      ${e.who.length?`<div class="who">${e.who.map(w=>`<button type="button" data-who="${esc(w)}">${hl(w)}</button>`).join("")}</div>`:""}
      <div class="meta"><button type="button" id="prev" ${sel===0?"disabled":""}>◀ 이전 별</button>
        <span>${sel+1}번째 별${e.bb?" (BB 별자리)":""}</span>
        <button type="button" id="next" ${sel===EP.length-1?"disabled":""}>다음 별 ▶</button></div>`;
    $("prev").onclick=()=>select(sel-1);
    $("next").onclick=()=>select(sel+1);
  }
  $("story").addEventListener("click",ev=>{ const w=ev.target.closest("[data-who]"); if(w) setQuery(w.dataset.who); });

  function paintSky(){
    const hits=[];
    EP.forEach((e,idx)=>{
      const v=visible(e);
      starEls[idx].classList.toggle("dim", !v);
      starEls[idx].classList.toggle("on", idx===sel);
      if(v && query) hits.push(e);
    });
    $("findline").setAttribute("d", hits.length>1 ? "M"+hits.map(e=>e.x.toFixed(1)+" "+e.y.toFixed(1)).join(" L") : "");
  }

  function renderEras(){
    const box=$("eras"); box.innerHTML="";
    const mk=(label,val,c,n)=>{
      const b=document.createElement("button"); b.type="button";
      b.setAttribute("aria-pressed",String(era===val));
      b.innerHTML=(c?`<i style="--c:${c}"></i>`:"")+esc(label)+(n!==undefined?` <small>${n}</small>`:"");
      b.onclick=()=>{ era=(era===val?null:val); if(val===null) era=null; sel=null; update(); };
      box.appendChild(b);
    };
    mk("전체",null,null,EP.length);
    ERAS.forEach(r=>mk(r,r,eraColor(r),EP.filter(e=>e.era===r).length));
  }

  function renderList(){
    const box=$("list");
    const groups=(era?[era]:ERAS).map(r=>[r,EP.filter(e=>e.era===r&&visible(e))]).filter(([,l])=>l.length);
    if(!groups.length){ box.innerHTML=`<p class="empty">${query?"맞는 별이 없어요. 이름 한 글자만 적어 봐도 돼요.":"이 시기에는 아직 뜬 별이 없어요."}</p>`; return; }
    box.innerHTML=groups.map(([r,l])=>`<div class="group" style="--c:${eraColor(r)}"><h3>${esc(r)}<small>별 ${l.length}개</small></h3>`+
      l.map(e=>`<button type="button" class="item${e.i===sel?" on":""}" data-i="${e.i}"><b>${hl(e.title)}</b><span>${hl(e.who.join(", "))}</span></button>`).join("")+`</div>`).join("");
  }
  $("list").addEventListener("click",ev=>{
    const it=ev.target.closest("[data-i]"); if(!it) return;
    select(+it.dataset.i);
    $("skyWrap").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
  });

  function centerOn(e){
    const w=$("skyWrap"), svg=$("sky");
    if(w.scrollWidth<=w.clientWidth) return;
    const px=e.x/W*svg.clientWidth;
    w.scrollTo({left:px-w.clientWidth/2,behavior:reduce?"auto":"smooth"});
  }
  function select(i){
    if(i<0||i>=EP.length) return;
    sel=i; centerOn(EP[i]); update();
  }
  function update(){ paintSky(); renderStory(); renderEras(); renderList(); }

  /* ---------- 찾기 ---------- */
  const qi=$("q");
  function setQuery(v){ qi.value=v; onQuery(); }
  function onQuery(){
    query=qi.value.trim().toLowerCase(); $("clear").hidden=!query;
    if(sel!==null && !visible(EP[sel])) sel=null;
    update();
  }
  qi.addEventListener("input",onQuery);
  $("clear").onclick=()=>{ setQuery(""); qi.focus(); };

  /* ---------- 시작 ---------- */
  update();
  const w=$("skyWrap"); w.scrollLeft=(w.scrollWidth-w.clientWidth)/2;
})();
</script>
</body>
</html>
