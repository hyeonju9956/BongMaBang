<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>봉현마을방범대 세이브 파일</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚩</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<style>
:root{
  --ink:#2B1D12; --paper:#FFF6DC; --paper2:#F1DFAE;
  --sky:#8FD3F4; --sky2:#C4EBFB; --sun:#FFD43B; --red:#E5483B;
  --grass:#62B94A; --grass2:#4A9A36; --dirt:#D39A5B; --dirt2:#B97D40;
  --cloud:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{ --sky:#26305C; --sky2:#34407C; --grass:#3E8A33; --grass2:#2F6E27; --dirt:#9C6E3E; --dirt2:#83592F; --cloud:#56629A; }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  background:linear-gradient(var(--sky2),var(--sky) 60%);
  color:var(--ink);
  font-family:"Galmuri11","Galmuri9","DungGeunMo","NeoDunggeunmo",ui-monospace,monospace;
  font-size:14px; line-height:1.6;
  -webkit-font-smoothing:none; font-smooth:never;
  display:flex; flex-direction:column; gap:20px;
  padding:20px 16px;
  min-height:100%;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px dashed var(--red);outline-offset:4px}

/* 픽셀 테두리: 둥근 모서리 대신 계단식 모서리 */
.px{
  background:var(--paper);
  box-shadow:
    0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink),
    inset 0 -4px 0 0 var(--paper2);
}

/* ---------- 세이브 슬롯 ---------- */
.slot{flex:none;max-width:960px;width:100%;margin:4px auto 0;padding:16px 20px 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:center}
.slot-badge{grid-row:span 2;width:72px;height:72px;background:var(--sun);box-shadow:0 0 0 4px var(--ink);display:grid;place-items:center}
.slot h1{font-family:"Galmuri14","Galmuri11",monospace;font-size:26px;line-height:1.2;letter-spacing:-.5px}
.slot h1 small{font-size:13px;margin-left:10px;color:var(--red)}
.stats{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:13px}
.stats b{color:var(--red);font-weight:400}
.members{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.chip{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;background:var(--paper);box-shadow:0 0 0 2px var(--ink)}
.chip i{width:12px;height:12px;display:block;box-shadow:0 0 0 2px var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip-all{font-size:12px;opacity:.7}

/* ---------- 연도 점프 ---------- */
.years{flex:none;max-width:960px;width:100%;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:4px 4px 8px}
.years button{flex:none;padding:2px 10px;background:var(--paper);box-shadow:0 0 0 2px var(--ink);font-size:13px}
.years button[aria-current="true"]{background:var(--sun)}

/* ---------- 마을 길 (가로 타임라인) ---------- */
.world{
  flex:1; min-height:340px; position:relative;
  overflow-x:auto; overflow-y:hidden;
  margin:0 -16px;
  scrollbar-color:var(--ink) transparent;
}
.track{position:relative;height:100%;min-height:340px}
.ground{position:absolute;left:0;right:0;bottom:0;height:96px;
  background:
    linear-gradient(var(--grass) 0 16px, var(--grass2) 16px 20px, transparent 20px),
    repeating-linear-gradient(90deg,var(--dirt) 0 24px,var(--dirt2) 24px 28px);
}
.ground::after{content:"";position:absolute;left:0;right:0;top:54px;height:4px;
  background:repeating-linear-gradient(90deg,var(--paper) 0 16px,transparent 16px 32px);opacity:.7}
.cloud{position:absolute;width:64px;height:16px;background:var(--cloud);
  box-shadow:16px -12px 0 0 var(--cloud),32px -12px 0 0 var(--cloud),16px -24px 0 -4px var(--cloud),48px 0 0 0 var(--cloud)}

.sign{position:absolute;bottom:92px;width:96px;display:flex;flex-direction:column;align-items:center}
.sign-board{background:#A8672F;color:#FFF3C8;font-family:"Galmuri14","Galmuri11",monospace;font-size:20px;padding:4px 10px;box-shadow:0 0 0 4px var(--ink)}
.sign-post{width:8px;height:40px;background:#7A4A20;box-shadow:0 0 0 2px var(--ink)}

.node{position:absolute;bottom:92px;width:132px;display:flex;flex-direction:column;align-items:center;transition:opacity .2s}
.node.dim{opacity:.25}
.card{width:128px;text-align:left;padding:8px 10px 10px;margin-bottom:14px;transition:transform .15s steps(2)}
.card .m{font-family:"Galmuri14","Galmuri11",monospace;font-size:18px;line-height:1.2;color:var(--red)}
.card .t{font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.card .dots{display:flex;gap:3px;margin-top:6px}
.card .dots i{width:8px;height:8px;display:block;box-shadow:0 0 0 1px var(--ink)}
.card:hover{transform:translateY(-4px)}
.node.on .card{background:var(--sun);transform:translateY(-8px)}
.pole{width:4px;height:44px;background:var(--ink);position:relative}
.pole::before{content:"";position:absolute;left:4px;top:0;width:18px;height:12px;background:var(--paper);box-shadow:0 0 0 2px var(--ink)}
.node.on .pole::before{background:var(--red)}

.hero{position:absolute;bottom:34px;width:40px;height:56px;transition:left .7s steps(10);z-index:2;pointer-events:none}
.hero .flip{position:relative;width:40px;height:56px}
.hero.left .flip{transform:scaleX(-1)}
.hero svg{position:absolute;inset:0}
.hero .f2{opacity:0}
.hero.walk .f1{animation:fa .24s steps(1) infinite}
.hero.walk .f2{animation:fb .24s steps(1) infinite}
@keyframes fa{0%{opacity:1}50%{opacity:0}}
@keyframes fb{0%{opacity:0}50%{opacity:1}}

/* ---------- 대화창 ---------- */
.dialog{flex:none;max-width:960px;width:100%;margin:0 auto 6px;padding:22px 22px 16px;position:relative;min-height:170px;cursor:pointer}
.nameplate{position:absolute;top:-18px;left:18px;background:var(--red);color:#fff;padding:2px 12px;box-shadow:0 0 0 4px var(--ink);font-size:13px}
.dialog h2{font-family:"Galmuri14","Galmuri11",monospace;font-size:20px;font-weight:400;line-height:1.3;margin-bottom:4px}
.who{font-size:12px;opacity:.75;margin-bottom:8px}
.text{font-size:15px;line-height:1.75;max-width:62ch;min-height:3.5em;white-space:pre-wrap}
.caret{display:inline-block;margin-left:4px;color:var(--red);visibility:hidden}
.caret.show{visibility:visible;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:13px}
.nav button{padding:4px 10px;box-shadow:0 0 0 2px var(--ink);background:var(--paper)}
.nav button:disabled{opacity:.35;cursor:default}
.hint{font-size:11px;opacity:.6;text-align:center;max-width:960px;margin:0 auto}

@media (max-width:560px){
  .slot{grid-template-columns:1fr}
  .slot-badge{display:none}
  .slot h1{font-size:22px}
  .slot h1 small{display:block;margin:4px 0 0}
}
@media (prefers-reduced-motion:reduce){
  .hero{transition:none}
  .hero.walk .f1,.hero.walk .f2,.caret.show{animation:none}
  .card{transition:none}
}
</style>
</head>
<body>

<header class="slot px">
  <div class="slot-badge" id="badge" aria-hidden="true"></div>
  <h1><span id="squadName"></span><small>SLOT 1</small></h1>
  <div class="stats" id="stats"></div>
  <div class="members" id="members" role="group" aria-label="대원별로 보기"></div>
</header>

<nav class="years" id="years" aria-label="연도로 이동"></nav>

<main class="world" id="world" aria-label="에피소드 타임라인">
  <div class="track" id="track">
    <div class="ground"></div>
    <div class="hero" id="hero"><div class="flip" id="heroFlip"></div></div>
  </div>
</main>

<section class="dialog px" id="dialog" aria-live="polite">
  <div class="nameplate" id="dlgDate">NEW GAME</div>
  <h2 id="dlgTitle"></h2>
  <p class="who" id="dlgWho"></p>
  <p class="text"><span id="dlgText"></span><span class="caret" id="caret">▼</span></p>
  <div class="nav">
    <button id="prev" type="button">◀ 이전</button>
    <span id="pos"></span>
    <button id="next" type="button">다음 ▶</button>
  </div>
</section>
<p class="hint">← → 키로 이동 · 대화창을 누르면 글이 바로 다 나와요</p>

<script src="episodes.js"></script>
<script>
(function(){
  const SQUAD = window.SQUAD || { name:"우리 방범대", members:[] };
  const colorOf = {};
  (SQUAD.members||[]).forEach(m => colorOf[m.name] = m.color || "#999");

  const norm = d => { const p = String(d||"").split("-");
    return [(p[0]||"0000"),(p[1]||"00").padStart(2,"0"),(p[2]||"00").padStart(2,"0")].join("-"); };
  const EP = (window.EPISODES||[])
    .map((e,i)=>({...e, who:e.who||[], _i:i, _k:norm(e.date)}))
    .sort((a,b)=>a._k.localeCompare(b._k) || a._i-b._i);

  const fmt = e => { const [y,m,d]=e._k.split("-"); let s=y+"년";
    if(m!=="00") s+=" "+(+m)+"월"; if(d!=="00") s+=" "+(+d)+"일"; return s; };

  const $ = id => document.getElementById(id);
  const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- 픽셀 스프라이트 (방범대 모자 + 완장) ---- */
  const PAL={Y:"#FFD43B",K:"#2B1D12",S:"#F6C79E",R:"#E5483B",W:"#FFFFFF",B:"#3A6FD8"};
  const top=["..KKKKK...",".KYYYYYK..",".KYYRYYKK.","KKKKKKKKKK","..SSSSS...","..SKSSK...","..SSSSS...","...SSS....",".RRWWRRR..","SRRWWRRRS.","S.RRRRR.S."];
  const A=top.concat(["..BBBBB...","..BB.BB...","..SS.SS...",".KK..KK..."]);
  const Bf=top.concat(["..BBBBB...",".BB...BB..","SS.....SS.","KK......KK"]);
  const svg=(rows,cls)=>{let r="";rows.forEach((row,y)=>[...row].forEach((c,x)=>{if(PAL[c])r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[c]}"/>`}));
    return `<svg class="${cls}" viewBox="0 0 10 ${rows.length}" width="40" height="${rows.length*4}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;};
  $("heroFlip").innerHTML = svg(A,"f1")+svg(Bf,"f2");
  $("badge").innerHTML = svg(A,"").replace('width="40"','width="40" style="position:static"');

  /* ---- 슬롯 정보 ---- */
  $("squadName").textContent = SQUAD.name;
  document.title = SQUAD.name + " 세이브 파일";
  const firstY = EP.length ? +EP[0]._k.slice(0,4) : new Date().getFullYear();
  const playYears = new Date().getFullYear() - firstY;
  $("stats").innerHTML =
    `<span>플레이 타임 <b>${playYears}년째</b></span>`+
    `<span>모은 에피소드 <b>${EP.length}개</b></span>`+
    (EP.length?`<span>최근 기록 <b>${esc(fmt(EP[EP.length-1]))}</b></span>`:"");

  /* ---- 대원 필터 ---- */
  let filter = null;
  const chips = [];
  (SQUAD.members||[]).forEach(m=>{
    const b=document.createElement("button");
    b.className="chip"; b.type="button"; b.setAttribute("aria-pressed","false");
    b.innerHTML=`<i style="background:${esc(m.color)}"></i>${esc(m.name)}`;
    b.onclick=()=>{ filter = filter===m.name?null:m.name; applyFilter(); };
    chips.push([m.name,b]); $("members").appendChild(b);
  });
  function applyFilter(){
    chips.forEach(([n,b])=>b.setAttribute("aria-pressed", String(n===filter)));
    EP.forEach(e=>e._el.classList.toggle("dim", !!filter && !e.who.includes(filter)));
  }

  /* ---- 길 위에 배치 ---- */
  const track=$("track"), world=$("world"), hero=$("hero");
  let x=60, lastY=null; const yearStart={};
  EP.forEach((e,idx)=>{
    const y=e._k.slice(0,4);
    if(y!==lastY){
      const s=document.createElement("div");
      s.className="sign"; s.style.left=x+"px";
      s.innerHTML=`<div class="sign-board">${esc(y)}</div><div class="sign-post"></div>`;
      track.appendChild(s); yearStart[y]=idx; lastY=y; x+=124;
    }
    e._x=x;
    const n=document.createElement("div");
    n.className="node"; n.style.left=x+"px";
    const m=e._k.slice(5,7);
    const dots=e.who.map(w=>`<i style="background:${esc(colorOf[w]||"#999")}"></i>`).join("");
    n.innerHTML=`<button class="card px" type="button" aria-label="${esc(fmt(e)+" "+e.title)}">
        <div class="m">${m!=="00"?(+m)+"월":"그해"}</div>
        <div class="t">${esc(e.title)}</div>
        <div class="dots">${dots}</div></button><div class="pole"></div>`;
    n.querySelector("button").onclick=()=>select(idx);
    track.appendChild(n); e._el=n; x+=156;
  });
  const W=Math.max(x+140, 600);
  track.style.width=W+"px";
  for(let cx=80; cx<W; cx+=380+((cx*7)%160)){
    const c=document.createElement("div"); c.className="cloud";
    c.style.left=cx+"px"; c.style.top=(40+((cx*13)%70))+"px";
    track.insertBefore(c, track.firstChild);
  }

  /* ---- 연도 점프 ---- */
  const yearBtns={};
  Object.keys(yearStart).forEach(y=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=y;
    b.onclick=()=>select(yearStart[y]); yearBtns[y]=b; $("years").appendChild(b);
  });

  /* ---- 선택 & 대화창 ---- */
  let cur=-1, typer=null, walkT=null;
  function select(i, smooth=true){
    if(!EP.length) return;
    i=Math.max(0,Math.min(EP.length-1,i));
    const e=EP[i];
    if(cur>=0) EP[cur]._el.classList.remove("on");
    e._el.classList.add("on");
    const hx=e._x+46;
    const prevLeft=parseFloat(hero.style.left||hx);
    hero.classList.toggle("left", hx<prevLeft);
    hero.style.left=hx+"px";
    if(!reduce && cur>=0 && hx!==prevLeft){
      hero.classList.add("walk"); clearTimeout(walkT);
      walkT=setTimeout(()=>hero.classList.remove("walk"),700);
    }
    cur=i;
    world.scrollTo({left:e._x-world.clientWidth/2+66, behavior:(smooth&&!reduce)?"smooth":"auto"});
    const y=e._k.slice(0,4);
    Object.entries(yearBtns).forEach(([k,b])=>b.setAttribute("aria-current",String(k===y)));
    $("dlgDate").textContent=fmt(e);
    $("dlgTitle").textContent=e.title||"";
    $("dlgWho").textContent=e.who.length?"함께한 대원: "+e.who.join(", "):"";
    $("pos").textContent=(i+1)+" / "+EP.length;
    $("prev").disabled=i===0; $("next").disabled=i===EP.length-1;
    type(e.text||"");
  }
  function type(t){
    clearInterval(typer);
    const out=$("dlgText"), caret=$("caret");
    caret.classList.remove("show");
    if(reduce){ out.textContent=t; caret.classList.add("show"); return; }
    let k=0; out.textContent="";
    typer=setInterval(()=>{ k+=1; out.textContent=t.slice(0,k);
      if(k>=t.length){ clearInterval(typer); typer=null; caret.classList.add("show"); } },28);
    out.dataset.full=t;
  }
  $("dialog").addEventListener("click",ev=>{
    if(ev.target.closest("button")) return;
    if(typer){ clearInterval(typer); typer=null; $("dlgText").textContent=$("dlgText").dataset.full; $("caret").classList.add("show"); }
  });
  $("prev").onclick=()=>select(cur-1);
  $("next").onclick=()=>select(cur+1);
  document.addEventListener("keydown",ev=>{
    if(ev.key==="ArrowRight"){ select(cur+1); ev.preventDefault(); }
    if(ev.key==="ArrowLeft"){ select(cur-1); ev.preventDefault(); }
  });
  world.addEventListener("wheel",ev=>{
    if(Math.abs(ev.deltaY)>Math.abs(ev.deltaX)){ world.scrollLeft+=ev.deltaY; ev.preventDefault(); }
  },{passive:false});

  if(EP.length){ hero.style.left=(EP[0]._x+46)+"px"; select(0,false); }
  else{
    hero.style.left="80px";
    $("dlgTitle").textContent="아직 저장된 에피소드가 없어요";
    $("dlgText").textContent="episodes.js 파일을 열어 첫 에피소드를 적어 주세요.";
    $("prev").disabled=$("next").disabled=true;
  }
})();
</script>
</body>
</html>
